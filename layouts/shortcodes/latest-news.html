{{ $count := .Get "count" | default 1 }}
{{ $section := .Get "section" | default "blog" }}
{{ $pages := where .Site.RegularPages "Section" $section }}
{{ $pages = $pages | first $count }}

<div class="latest-news-badge">
  <div class="latest-news-badge__label"><i class="fa-solid fa-newspaper"></i> News</div>
  {{ range $pages }}
  <a href="{{ .RelPermalink }}" class="latest-news-badge__link">
    <span class="latest-news-badge__date">{{ .Date.Format "02.01.2006" }}</span>
    <span class="latest-news-badge__title">{{ .Title }}</span>
  </a>
  {{ end }}
  <a href="/{{ .Page.Language.Lang }}/blog/news/" class="latest-news-badge__all">alle →</a>
</div>
